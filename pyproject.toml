[project]
name = "yt-live-kit"
version = "0.2.0"
description = "YouTube ライブアーカイブから字幕・チャプター・切り抜き素材を生成するローカル Web UI ツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.12.0",
    "yt-dlp>=2026.1.0",
]

[project.scripts]
yt-live-kit = "yt_live_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_live_kit"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
